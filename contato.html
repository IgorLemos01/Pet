<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contatos</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>
    <main>

        <h1>Entre em contato conosco.</h1>
        <form action="mailto:igorlemos076@gmail.com" method="post" enctype="text/plain">
            <div class="row g-3">

                <div class="col-12 col-md-6">
                    <label for="fname">Primeiro nome:</label>
                    <input type="text" id="fname" name="fname" class="form-control">
                </div>

                <div class="col-12 col-md-6">
                    <label for="fsobrenome">Sobrenome:</label>
                    <input type="text" id="fsobrenome" name="fsobrenome" class="form-control">
                </div>

                <div class="col-12 col-md-6">
                    <label for="nascimento">Data de nascimento:</label>
                    <input type="date" id="nascimento" name="nascimento" class="form-control">
                </div>

                <div class="col-12 col-md-6">
                    <label for="email">Email: </label>
                    <input type="email" id="email" name="email" class="form-control">
                </div>

                <div class="col-12 col-md-4">
                    <label for="telefone">Telefone: </label>
                    <input type="tel" name="telefone" id="telefone" class="form-control">
                </div>

                <div class="col-12">
                    <label for="mensagem">O que achou do nosso site?</label><br>
                    <textarea id="mensagem" name="mensagem" rows="6" required class="form-control"></textarea>
                </div>

                <div class="col-12 col-md-6">
                    <p>Como você nos encontrou?</p>
                    <select name="origem" class="form-select">
                        <option value="disabled selected hidden">Selecione</option>
                        <option value="Instagram">Instagram</option>
                        <option value="Google">Google</option>
                        <option value="Amigos">Amigos</option>
                        <option value="Youtube">Youtube</option>
                    </select>
                </div>

                <div class="col-12 col-md-6">
                    <p>Essa é a sua primeira compra no site?</p>

                    <input type="radio" id="Sim" name="Positivo" value="Sim">
                    <label for="Sim">Sim</label>

                    <input type="radio" id="Nao" name="Positivo" value="Nao">
                    <label for="Nao">Não</label>
                </div>

                <div class="col-12">
                    <input type="submit" value="submit" class="btn btn-primary">
                </div>

            </div>
        </form>
    </main>
</body>

</html>
