<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Contatos</title>
</head>

<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="contato.html">Contato</a></li>
                <li><a href="produtos.html">Sobre</a></li>
            </ul>
        </nav>
    </header>
    <main>

        <h1>Entre em contato conosco.</h1>
        <form action="mailto:igorlemos076@gmail.com" method="post" enctype="text/plain">
            <label for="fname">Primeiro nome:</label><br>
            <input type="text" id="fname" name="fname"><br>

            <label for="fsobrenome">Sobrenome:</label><br>
            <input type="text" id="fsobrenome" name="fsobrenome"><br>

            <label for="nascimento">Data de nascimento:</label><br>
            <input type="date" id="nascimento" name="nascimento"><br>

            <label for="email">Email: </label><br>
            <input type="email" id="email" name="email"><br>

            <label for="telefone">Telefone: </label><br>
            <input type="tel" name="telefone" id="telefone"><br>

            <p>Como você nos encontrou?</p>
            <br>
            <select name="origem">
                <option value="disabled selected hidden">Selecione</option>
                <option value="Instagram">Instagram</option>
                <option value="Google">Google</option>
                <option value="Amigos">Amigos</option>
                <option value="Youtube">Youtube</option>
            </select><br><br>
            <p>Essa é a sua primeira compra no site?</p>

            <input type="radio" id="Sim" name="Positivo" value="Sim">
            <label for="Sim">Sim</label><br>

            <input type="radio" id="Nao" name="Positivo" value="Nao">
            <label for="Nao">Não</label><br><br>


            <input type="submit" value="submit">
            <input type="reset" value="Reset">
            -<button type="button">Enviar</button>

        </form>
    </main>
